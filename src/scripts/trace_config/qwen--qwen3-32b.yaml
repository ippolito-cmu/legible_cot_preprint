sampling_params:
  max_tokens: 8192
  temperature: 0.6
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.1

vllm_kwargs:
  max_model_len: 16384
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enforce_eager: false
  enable_chunked_prefill: true
  disable_custom_all_reduce: false
  max_num_seqs: 256
  dtype: bfloat16
