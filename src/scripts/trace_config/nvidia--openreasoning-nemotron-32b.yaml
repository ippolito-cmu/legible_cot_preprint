sampling_params:
  max_tokens: 8192
  temperature: 0.6
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.1

vllm_kwargs:
  tensor_parallel_size: 4
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.9
  enable_prefix_caching: true
  enable_chunked_prefill: true
  max_num_seqs: 64
  dtype: bfloat16
