sampling_params:
  max_tokens: 8192
  temperature: 1.0
  top_p: 1.0
  top_k: 50
  repetition_penalty: 1.1


vllm_kwargs:
  tensor_parallel_size: 8
  gpu_memory_utilization: 0.9
  enable_prefix_caching: true
  enforce_eager: false
  enable_chunked_prefill: true
  disable_custom_all_reduce: false
  max_num_seqs: 1024
  dtype: 'bfloat16'
