sampling_params:
  max_tokens: 8192
  temperature: 0.0

vllm_kwargs:
  tensor_parallel_size: 8
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.9
  enable_prefix_caching: true
  enforce_eager: true
  distributed_executor_backend: 'ray'
  enable_chunked_prefill: true
  disable_custom_all_reduce: false
  max_num_seqs: 1024
  dtype: 'bfloat16'
